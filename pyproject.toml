[project]
name = "omega-invasion"
version = "0.1.0"
description = ""
authors = [
    {name = "Ian Salazar Jara",email = "isalazarjara@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygame-ce (>=2.5.8,<3.0.0)"
]

[tool.poetry]
packages = [{include = "omega_invasion", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
omega-invasion = "omega_invasion.main:principal"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
